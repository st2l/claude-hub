[project]
name = "claude-hub"
version = "0.1.0"
description = "TUI for managing Claude Code providers, models, and tier assignments"
requires-python = ">=3.11"
# Windows has no stdlib curses. Not pinned: each Python release needs a
# windows-curses build that ships wheels for it.
dependencies = [
    "windows-curses>=2.4.2; sys_platform == 'win32'",
]

[project.scripts]
claude-hub = "claude_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
